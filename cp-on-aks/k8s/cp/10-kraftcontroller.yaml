# Phase A: KRaft controller (metadata quorum). One replica is enough for a lab;
# production uses 3 or 5.
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:8.2.4
    init: confluentinc/confluent-init-container:3.3.1
  dataVolumeCapacity: 10Gi
  storageClass:
    name: managed-csi   # AKS default CSI disk class (the upstream example uses AWS gp2)
