# Phase A: topic + Datagen connector producing Avro "pageviews" records.
# The Avro converter registers the value schema in Schema Registry
# (subject: pageviews-value).
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: pageviews
  namespace: confluent
spec:
  replicas: 3
  partitionCount: 3
  kafkaClusterRef:
    name: kafka
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: datagen-pageviews
  namespace: confluent
spec:
  class: io.confluent.kafka.connect.datagen.DatagenConnector
  taskMax: 1
  connectClusterRef:
    name: connect
  configs:
    kafka.topic: pageviews
    quickstart: pageviews
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url: http://schemaregistry.confluent.svc.cluster.local:8081
    max.interval: "500"
    iterations: "100000000"
