# Phase B: USM Agent. Single outbound path from CP to Confluent Cloud.
# Before applying, replace the two placeholders below with the values from the
# agent config JSON (wizard): FRONTDOOR_URL and ENVIRONMENT_ID.
# Apply with:  kubectl apply -f k8s/usm/20-usmagent.yaml
# No externalAccess: CP runs in the same AKS cluster and reaches the agent via
# the in-cluster Service usm-agent.confluent.svc.cluster.local:10000.
apiVersion: platform.confluent.io/v1beta1
kind: USMAgent
metadata:
  name: usm-agent
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-usm-agent:1.2.1
    init: confluentinc/confluent-init-container:3.3.1
  confluentCloudClient:
    endpoint: https://api-ap4vrez3.germanywestcentral.azure.accesspoint.glb.confluent.cloud     # e.g. https://api-apxxxxxx.germanywestcentral.azure.accesspoint.glb.confluent.cloud:443
    environmentId: env-g2y51n # e.g. env-xxxxxx
    authentication:
      type: basic
      basic:
        secretRef: usm-ccloud-cred
