# Phase B: Connect with USM. Identical to k8s/cp/13-connect.yaml plus the block
# marked "--- USM ---".
# CP 8.2.4 is not affected by the "Connect metrics missing from USM" issue
# (8.2.0-8.2.2 are). On an affected version, add the metrics.include override
# from https://docs.confluent.io/cloud/current/usm/troubleshoot.html under
# spec.configOverrides.server.
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:8.2.4
    init: confluentinc/confluent-init-container:3.3.1
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: 0.7.2
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
    # --- USM --- workers send connector metadata and metrics to the agent
    usmAgentClient:
      url: http://usm-agent.confluent.svc.cluster.local:10000
