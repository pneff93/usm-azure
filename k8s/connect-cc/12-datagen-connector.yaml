# Datagen connector producing Avro "pageviews" records into the Confluent Cloud
# topic "pageviews" (create the topic in CC first, see README B2).
# The Avro converter registers the value schema in CC Schema Registry
# (subject: pageviews-value).
# Apply with:  envsubst '$CC_SR_URL' < k8s/connect-cc/12-datagen-connector.yaml | kubectl apply -f -
# Only $CC_SR_URL is substituted; the ${file:...} references stay as they are and
# are resolved by the Connect worker from the mounted secret ccloud-sr-cred.
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: datagen-pageviews
  namespace: confluent
spec:
  class: io.confluent.kafka.connect.datagen.DatagenConnector
  taskMax: 1
  connectClusterRef:
    name: connect
  configs:
    kafka.topic: pageviews
    quickstart: pageviews
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url: ${CC_SR_URL}
    value.converter.basic.auth.credentials.source: USER_INFO
    value.converter.basic.auth.user.info: "${file:/mnt/secrets/ccloud-sr-cred/basic.txt:username}:${file:/mnt/secrets/ccloud-sr-cred/basic.txt:password}"
    max.interval: "500"
    iterations: "100000000"
