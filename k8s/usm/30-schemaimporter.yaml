# Phase B: switchover. Because schemaRegistryAutomation is set, CFK sets
# on-prem SR to FORWARD and Cloud SR to READWRITE, then keeps importing schemas
# from Cloud SR into the local cache.
# Apply with:  envsubst < k8s/usm/30-schemaimporter.yaml | kubectl apply -f -
apiVersion: platform.confluent.io/v1beta1
kind: SchemaImporter
metadata:
  name: schema-importer
  namespace: confluent
spec:
  sourceCluster:
    schemaRegistryRest:
      endpoint: ${CC_SR_URL}
      authentication:
        type: basic
        basic:
          secretRef: cc-sr-credential
  destinationCluster:
    schemaRegistryClusterRef:
      name: schemaregistry
      namespace: confluent
  schemaRegistryAutomation:
    exporterName: schema-exporter   # must match 25-schemaexporter.yaml
  subjects: [":*:"]
  contextName: "."
