# Phase B: Schema Registry with the USM extension. Identical to
# k8s/cp/12-schemaregistry.yaml plus the blocks marked "--- USM ---".
# Apply with:  envsubst < k8s/usm/24-schemaregistry-usm.yaml | kubectl apply -f -
#   ${CC_SR_URL} -> "SCHEMA_REGISTRY_URL" from the agent config JSON (private endpoint)
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.2.4
    init: confluentinc/confluent-init-container:3.3.1
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
  # --- USM --- encrypts the Cloud SR credentials stored in exporter/importer configs
  passwordEncoder:
    secretRef: password-encoder-secret
  # --- USM --- enable schema linking in both directions
  enableSchemaExporter: true
  enableSchemaImporter: true
  # --- USM --- forwarder extension: in FORWARD mode, writes go to Cloud SR
  unifiedStreamManager:
    enabled: true
    remoteSchemaRegistry:
      endpoint: ${CC_SR_URL}
      authentication:
        type: basic
        basic:
          secretRef: cc-sr-credential
